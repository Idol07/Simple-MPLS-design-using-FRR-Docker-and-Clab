frr version 9.1_git
frr defaults traditional
hostname p1
no ipv6 forwarding
!
interface eth1
 ip address 10.0.0.5/30
 ip ospf network point-to-point
exit
!
interface eth2
 ip address 10.0.0.1/30
 ip ospf network point-to-point
exit
!
interface eth3
 ip add 10.0.1.1/30
 ip ospf network point-to-point 
 exit
!
interface lo
 ip address 1.1.1.1/32
exit
!
router ospf
 ospf router-id 1.1.1.1
 network 1.1.1.1/32 area 0
 network 10.0.0.0/30 area 0
 network 10.0.0.4/30 area 0
 network 10.0.1.0/30 area 0
 mpls ldp-sync
exit
!
mpls ldp
 router-id 1.1.1.1
 !
 address-family ipv4
  discovery transport-address 1.1.1.1
  !
  interface eth1
  exit
  !
  interface eth2
  exit 
  !
  interface eth3 
  exit 
  !
 exit-address-family
 !
exit
!
