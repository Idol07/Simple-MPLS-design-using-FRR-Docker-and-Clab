frr version 9.1_git
frr defaults traditional
hostname ce1b
no ipv6 forwarding
!
interface eth1
 ip address 10.0.0.14/30
exit
!

router bgp 65005
 bgp router-id 5.5.5.5
 no bgp ebgp-requires-policy
 neighbor 10.0.0.13 remote-as 65000
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
 exit-address-family
exit
!
