frr version 9.1_git
frr defaults traditional
hostname p2
no ipv6 forwarding
!
interface eth1
 ip address 10.0.0.25/30
 ip ospf network point-to-point
 ip ospf cost 100
exit
!
interface eth2
 ip address 10.0.0.29/30
 ip ospf network point-to-point
 ip ospf cost 100
exit
!
interface eth3
 ip address 10.0.1.2/30
 ip ospf net point-to-point
exit 
!
interface lo
 ip address 4.4.4.4/32
exit
!
router ospf
 ospf router-id 4.4.4.4
 network 4.4.4.4/32 area 0
 network 10.0.0.24/30 area 0
 network 10.0.0.28/30 area 0
 network 10.0.1.0/30 area 0
 mpls ldp-sync
exit
!
mpls ldp
 router-id 4.4.4.4
 !
 address-family ipv4
  discovery transport-address 4.4.4.4
  !
  interface eth1
  exit
  !
  interface eth2
  exit
  !
  interface eth3 
  exit 
  !
 exit-address-family
 !
exit
!
