frr version 9.1_git
frr defaults traditional
hostname pe1
no ipv6 forwarding
!
interface eth2
 ip address 10.0.0.9/30
exit
!
interface eth3
 ip address 10.0.0.13/30
exit
!
interface eth1
 ip address 10.0.0.6/30
 ip ospf network point-to-point
exit
!
interface eth4
 ip address 10.0.0.26/30
 ip ospf network point-to-point
exit
!
interface lo
 ip address 2.2.2.2/32
exit
!
router bgp 65000
 bgp router-id 2.2.2.2
 neighbor 3.3.3.3 remote-as 65000
 neighbor 3.3.3.3 update-source lo
 !
 address-family ipv4 vpn
  neighbor 3.3.3.3 activate
  neighbor 3.3.3.3 next-hop-self
 exit-address-family
exit
!
router bgp 65000 vrf custA
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.10 remote-as 65010
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65010:10
  rt vpn both 65010:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf custB
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.14 remote-as 65005
 !
 address-family ipv4 unicast
  redistribute connected
  label vpn export auto
  rd vpn export 65005:10
  rt vpn both 65005:10
  export vpn
  import vpn
 exit-address-family
exit
!
router ospf
 ospf router-id 2.2.2.2
 network 2.2.2.2/32 area 0
 network 10.0.0.4/30 area 0
 network 10.0.0.24/30 area 0
 mpls ldp-sync
exit
!
mpls ldp
 router-id 2.2.2.2
 !
 address-family ipv4
  discovery transport-address 2.2.2.2
  !
  interface eth1
  exit
  !
  interface eth4
  exit
  !
 exit-address-family
 !
exit
!
