frr version 9.1_git
frr defaults traditional
hostname ce2a
no ipv6 forwarding
!
interface eth1
 ip address 10.0.0.18/30
exit
!
router bgp 65015
 bgp router-id 6.6.6.6
 no bgp ebgp-requires-policy
 neighbor 10.0.0.17 remote-as 65000
 !
 address-family ipv4 unicast
  network 192.168.2.0/24
 exit-address-family
exit
!
