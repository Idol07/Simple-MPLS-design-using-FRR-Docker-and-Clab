frr version 9.1_git
frr defaults traditional
hostname pe2
no ipv6 forwarding
!
interface eth2
 ip address 10.0.0.17/30
exit
!
interface eth3
 ip address 10.0.0.21/30
exit
!
interface eth1
 description link to p1
 ip address 10.0.0.2/30
 ip ospf network point-to-point
exit
!
interface eth4
 description link to p2
 ip address 10.0.0.30/30
 ip ospf network point-to-point
exit
!
interface lo
 ip address 3.3.3.3/32
exit
!
router ospf
 ospf router-id 3.3.3.3
 network 3.3.3.3/32 area 0
 network 10.0.0.0/30 area 0
 network 10.0.0.28/30 area 0
 mpls ldp-sync
exit
!
mpls ldp
 router-id 3.3.3.3
 !
 address-family ipv4
  discovery transport-address 3.3.3.3
  !
  interface eth1
  exit
  !
  interface eth4
  exit
  !
 exit-address-family
 !
exit
!
