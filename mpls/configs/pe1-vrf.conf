
!
interface eth2 vrf custA
 ip address 10.0.0.9/30
!
interface eth3 vrf custB
 ip address 10.0.0.13/30
!
router bgp 65000
 bgp router-id 2.2.2.2
 neighbor 3.3.3.3 remote-as 65000
 neighbor 3.3.3.3 update-source lo
 address-family ipv4 vpn
 neighbor 3.3.3.3 activate
 neighbor 3.3.3.3 send-community extended
 neighbor 3.3.3.3 next-hop-self
 exit-address-family
!
router bgp 65000 vrf custA
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 neighbor 10.0.0.10 remote-as 65010
 address-family ipv4 unicast
 neighbor 10.0.0.10 activate
 rd vpn export 65000:10
 rt vpn import 65000:10
 rt vpn export 65000:10
 label vpn export auto
 export vpn
 import vpn
 redistribute connected
 exit-address-family
!
router bgp 65000 vrf custB
 bgp router-id 2.2.2.2
 neighbor 10.0.0.14 remote-as 65005
 no bgp ebgp-requires-policy
 address-family ipv4 unicast
 neighbor 10.0.0.14 activate
 rd vpn export 65000:20
 rt vpn import 65000:20
 rt vpn export 65000:20
 label vpn export auto
 export vpn
 import vpn
 redistribute connected
 exit-address-family
!
