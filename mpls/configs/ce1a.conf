frr version 9.1_git
frr defaults traditional
hostname ce1a
no ipv6 forwarding
!
interface eth1
 ip address 10.0.0.10/30
exit
!

router bgp 65010
 bgp router-id 4.4.4.4
 no bgp ebgp-requires-policy
 neighbor 10.0.0.9 remote-as 65000
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
 exit-address-family
exit
!
