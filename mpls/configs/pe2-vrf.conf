frr version 9.1.0
frr defaults traditional
!
interface eth2 vrf custA
 ip address 10.0.0.17/30
!
interface eth3 vrf custB
 ip address 10.0.0.21/30
!
router bgp 65000
 bgp router-id 3.3.3.3
 neighbor 2.2.2.2 remote-as 65000
 neighbor 2.2.2.2 update-source lo
 address-family ipv4 vpn
 neighbor 2.2.2.2 activate
 neighbor 2.2.2.2 send-community extended
 neighbor 2.2.2.2 next-hop-self
 exit-address-family
!

router bgp 65000 vrf custA
 bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.0.0.18 remote-as 65015
 address-family ipv4 unicast
 neighbor 10.0.0.18 activate
 rd vpn export 65000:10
 rt vpn import 65000:10
 rt vpn export 65000:10
 label vpn export auto
 export vpn
 import vpn
 redistribute connected
 exit-address-family
!
router bgp 65000 vrf custB
bgp router-id 3.3.3.3
 no bgp ebgp-requires-policy
 neighbor 10.0.0.22 remote-as 65020
 address-family ipv4 unicast
 neighbor 10.0.0.22 activate
 rd vpn export 65000:20
 rt vpn import 65000:20
 rt vpn export 65000:20
 label vpn export auto
 export vpn
 import vpn
 redistribute connected
 exit-address-family
!
