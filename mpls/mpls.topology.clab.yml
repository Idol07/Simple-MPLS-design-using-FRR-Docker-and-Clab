name: mpls

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.1.1
    sysctls: 
      net.ipv6.conf.all.disable_ipv6: 0
      net.mpls.platform_labels: 1048575
      net.ipv4.ip_forward: 1
      net.mpls.conf.lo.input: 1
    
   


  nodes:
    pe1:
      binds:
        - daemons-pe:/etc/frr/daemons
        - configs/pe1.conf:/etc/frr/frr.conf
        - configs/pe1-vrf.conf:/etc/frr/pe1-vrf.conf
      exec:
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth4.input=1
        - ip link add custA type vrf table 10 
        - ip link set custA up 
        - ip link set eth2 master custA
        - ip link add custB type vrf table 20
        - ip link set custB up
        - ip link set eth3 master custB
        - sleep 10
        - vtysh -f /etc/frr/pe1-vrf.conf
        

    p1:
      binds:
        - daemons-p:/etc/frr/daemons
        - configs/p1.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth2.input=1
        - sysctl -w net.mpls.conf.eth3.input=1
    p2:
      binds:
       - daemons-p:/etc/frr/daemons
       - configs/p2.conf:/etc/frr/frr.conf
      
      exec:
       - sysctl -w net.mpls.conf.eth1.input=1
       - sysctl -w net.mpls.conf.eth2.input=1
       - sysctl -w net.mpls.conf.eth3.input=1

    pe2:
      binds:
        - daemons-pe:/etc/frr/daemons
        - configs/pe2.conf:/etc/frr/frr.conf
        - configs/pe2-vrf.conf:/etc/frr/pe2-vrf.conf
      exec:
        - sysctl -w net.mpls.conf.eth1.input=1
        - sysctl -w net.mpls.conf.eth4.input=1
        - ip link add custA type vrf table 10
        - ip link set custA up 
        - ip link set eth2 master custA
        - ip link add custB type vrf table 20
        - ip link set custB up
        - ip link set eth3 master custB 
        
        - sleep 10
        - vtysh -f /etc/frr/pe2-vrf.conf
    ce1a:
       binds:
         - daemons-ce:/etc/frr/daemons
         - configs/ce1a.conf:/etc/frr/frr.conf 
       exec:
       - ip link set eth1 up
    ce2a:
      binds:
        - daemons-ce:/etc/frr/daemons
        - configs/ce2a.conf:/etc/frr/frr.conf 
      exec:
       - ip link set eth1 up
    ce1b:
      binds:
      - daemons-ce:/etc/frr/daemons
      - configs/ce1b.conf:/etc/frr/frr.conf 
      exec:
       - ip link set eth1 up
    ce2b:
      binds: 
       - daemons-ce:/etc/frr/daemons
       - configs/ce2b.conf:/etc/frr/frr.conf
      exec:
       - ip link set eth1 up
    

  links:
    - endpoints: ["pe1:eth1", "p1:eth1"]
    - endpoints: ["p1:eth2", "pe2:eth1"]
    - endpoints: ["pe1:eth2", "ce1a:eth1"]
    - endpoints: ["pe1:eth3", "ce1b:eth1"]
    - endpoints: ["pe2:eth2", "ce2a:eth1"]
    - endpoints: ["pe2:eth3", "ce2b:eth1"]
    - endpoints: ["p2:eth1", "pe1:eth4"]
    - endpoints: ["p2:eth2","pe2:eth4"]
    - endpoints: ["p1:eth3","p2:eth3"]




